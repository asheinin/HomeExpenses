<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --text: #333;
      --text-light: #666;
      --bg: #f8f9fa;
      --card-bg: #fff;
      --error: #d93025;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text);
      background: var(--bg);
    }

    .form-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      display: block;
      margin-bottom: 6px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: white;
    }

    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .split-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .split-row input {
      flex: 1;
    }

    .split-row span {
      font-size: 13px;
      color: var(--text-light);
      white-space: nowrap;
    }

    .split-sum {
      font-size: 12px;
      margin-top: 6px;
      color: var(--text-light);
    }

    .split-sum.invalid {
      color: var(--error);
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      font-family: inherit;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      box-shadow: 0 4px 10px rgba(118, 75, 162, 0.2);
    }

    .btn-secondary {
      background: #f1f3f4;
      color: var(--text);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-box {
      background: #fce8e6;
      color: var(--error);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      display: none;
      border: 1px solid #f5c2c7;
    }

    .input-error {
      border-color: var(--error) !important;
      background: #fff8f8;
    }
  </style>
</head>

<body>
  <div class="form-container">
    <h2>Change Split From Month</h2>

    <div id="errorMessage" class="error-box"></div>

    <div class="form-group">
      <label>Apply From Month</label>
      <select id="fromMonth">
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>
    </div>

    <div class="form-group">
      <label>Spouse 1 %</label>
      <div class="split-row">
        <input type="number" id="sp1Pct" min="0" max="100" step="0.1" value="50">
        <span>%</span>
      </div>
    </div>

    <div class="form-group">
      <label>Spouse 2 %</label>
      <div class="split-row">
        <input type="number" id="sp2Pct" min="0" max="100" step="0.1" value="50">
        <span>%</span>
      </div>
      <div id="splitSum" class="split-sum">Total: 100%</div>
    </div>

    <div class="actions">
      <button type="button" class="btn-primary" id="submit-btn" onclick="submitForm()">Apply</button>
      <button type="button" class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var currentMonth = new Date().getMonth() + 1;
      document.getElementById('fromMonth').value = currentMonth;
      updateSum();
      document.getElementById('sp1Pct').addEventListener('input', onSp1Change);
      document.getElementById('sp2Pct').addEventListener('input', updateSum);
    });

    function onSp1Change() {
      var sp1 = parseFloat(document.getElementById('sp1Pct').value) || 0;
      document.getElementById('sp2Pct').value = Math.round((100 - sp1) * 10) / 10;
      updateSum();
    }

    function updateSum() {
      var sp1 = parseFloat(document.getElementById('sp1Pct').value) || 0;
      var sp2 = parseFloat(document.getElementById('sp2Pct').value) || 0;
      var total = Math.round((sp1 + sp2) * 10) / 10;
      var sumEl = document.getElementById('splitSum');
      sumEl.textContent = 'Total: ' + total + '%';
      var valid = Math.abs(total - 100) < 0.01;
      sumEl.classList.toggle('invalid', !valid);
      document.getElementById('submit-btn').disabled = !valid;
    }

    function submitForm() {
      var sp1 = parseFloat(document.getElementById('sp1Pct').value);
      var sp2 = parseFloat(document.getElementById('sp2Pct').value);
      var monthIndex = parseInt(document.getElementById('fromMonth').value);

      if (isNaN(sp1) || isNaN(sp2) || Math.abs(sp1 + sp2 - 100) > 0.01) {
        showError('Split percentages must sum to exactly 100%.');
        return;
      }

      var btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Applying...';

      google.script.run
        .withSuccessHandler(function () { google.script.host.close(); })
        .withFailureHandler(function (err) {
          showError('Error: ' + err.message);
          btn.disabled = false;
          btn.textContent = 'Apply';
        })
        .setSplitFromMonth(monthIndex, sp1 / 100, sp2 / 100);
    }

    function showError(msg) {
      var el = document.getElementById('errorMessage');
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>

</html>
