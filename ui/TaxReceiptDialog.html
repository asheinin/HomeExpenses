<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --text: #333;
      --text-light: #666;
      --bg: #f8f9fa;
      --card-bg: #fff;
      --error: #d93025;
      --success: #2e7d32;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text);
      background: var(--bg);
    }

    .form-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      display: block;
      margin-bottom: 6px;
    }

    .date-row {
      display: flex;
      gap: 10px;
    }

    select {
      flex: 1;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: white;
    }

    select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      font-family: inherit;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      box-shadow: 0 4px 10px rgba(118, 75, 162, 0.2);
    }

    .btn-secondary {
      background: #f1f3f4;
      color: var(--text);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-box {
      background: #fce8e6;
      color: var(--error);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
      border: 1px solid #f5c2c7;
    }

    .input-error {
      border-color: var(--error) !important;
      background: #fff8f8;
    }
  </style>
</head>

<body>
  <div class="form-container">
    <h2>📄 Tax Receipt Dates</h2>

    <div id="errorMessage" class="error-box"></div>

    <form id="taxReceiptForm">
      <div class="form-group">
        <label>From Month</label>
        <div class="date-row">
          <select id="fromMonth" required>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
          <select id="fromYear" required>
            <? for (var i = 0; i < availableYears.length; i++) { ?>
            <option value="<?= availableYears[i] ?>"><?= availableYears[i] ?></option>
            <? } ?>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>To Month</label>
        <div class="date-row">
          <select id="toMonth" required>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
          <select id="toYear" required>
            <? for (var i = 0; i < availableYears.length; i++) { ?>
            <option value="<?= availableYears[i] ?>"><?= availableYears[i] ?></option>
            <? } ?>
          </select>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn-primary" id="submit-btn" onclick="submitForm()">Generate Receipt</button>
        <button type="button" class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
      </div>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const fromYearSelect = document.getElementById('fromYear');
      const toYearSelect = document.getElementById('toYear');

      // Default dates: Jan and Dec of active/current year
      const currentYear = new Date().getFullYear();
      
      // Determine if current year is in dropdown, otherwise default to latest available
      let defaultYear = currentYear;
      if (fromYearSelect.options.length > 0) {
        let hasCurrentYear = Array.from(fromYearSelect.options).some(opt => opt.value == currentYear);
        defaultYear = hasCurrentYear ? currentYear : fromYearSelect.options[fromYearSelect.options.length - 1].value;
      }
      
      document.getElementById('fromMonth').value = '01';
      fromYearSelect.value = defaultYear;
      
      document.getElementById('toMonth').value = '12';
      toYearSelect.value = defaultYear;

      // Clear errors on input change
      document.getElementById('fromMonth').addEventListener('change', handleFromChange);
      fromYearSelect.addEventListener('change', handleFromChange);
      document.getElementById('toMonth').addEventListener('change', clearErrors);
      toYearSelect.addEventListener('change', clearErrors);
    });
    
    function handleFromChange() {
      clearErrors();
      
      const fm = document.getElementById('fromMonth').value;
      const fy = document.getElementById('fromYear').value;
      
      if (fm && fy) {
        const fromDateObj = new Date(`${fy}-${fm}-01T00:00:00`);
        if (!isNaN(fromDateObj.getTime())) {
          // Add 11 months to get the end of the 12-month period
          const toDateObj = new Date(fromDateObj);
          toDateObj.setMonth(toDateObj.getMonth() + 11);
          
          const yyyy = toDateObj.getFullYear();
          const mm = String(toDateObj.getMonth() + 1).padStart(2, '0');
          
          document.getElementById('toMonth').value = mm;
          
          // Only update To Year if it exists in the dropdown
          const toYearSelect = document.getElementById('toYear');
          if (Array.from(toYearSelect.options).some(opt => opt.value == yyyy)) {
             toYearSelect.value = yyyy;
          }
        }
      }
    }

    function submitForm() {
      const btn = document.getElementById('submit-btn');
      
      const fm = document.getElementById('fromMonth').value;
      const fy = document.getElementById('fromYear').value;
      const tm = document.getElementById('toMonth').value;
      const ty = document.getElementById('toYear').value;
      
      const fromMonthStr = `${fy}-${fm}`;
      const toMonthStr = `${ty}-${tm}`;

      clearErrors();
      var errors = [];

      const fromDate = new Date(fromMonthStr + "-01T00:00:00");
      const toDate = new Date(toMonthStr + "-01T00:00:00");

      if (fromDate > toDate) {
         errors.push('From Month must be before To Month');
         document.getElementById('fromMonth').classList.add('input-error');
         document.getElementById('fromYear').classList.add('input-error');
         document.getElementById('toMonth').classList.add('input-error');
         document.getElementById('toYear').classList.add('input-error');
      } else {
         const monthsDiff = (toDate.getFullYear() - fromDate.getFullYear()) * 12 + (toDate.getMonth() - fromDate.getMonth());
         
         if (monthsDiff > 11) {
           errors.push('Date range cannot exceed 12 consecutive months.');
           document.getElementById('fromMonth').classList.add('input-error');
           document.getElementById('fromYear').classList.add('input-error');
           document.getElementById('toMonth').classList.add('input-error');
           document.getElementById('toYear').classList.add('input-error');
         }

         const yearDiff = toDate.getFullYear() - fromDate.getFullYear();
         if (yearDiff > 1) {
           errors.push('Date range cannot span more than 2 calendar years.');
           document.getElementById('fromMonth').classList.add('input-error');
           document.getElementById('fromYear').classList.add('input-error');
           document.getElementById('toMonth').classList.add('input-error');
           document.getElementById('toYear').classList.add('input-error');
         }
      }

      if (errors.length > 0) {
        var errorDiv = document.getElementById('errorMessage');
        errorDiv.innerHTML = '<strong>Validation Error:</strong><br>' + errors.join('<br>');
        errorDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Generating...';

      google.script.run
        .withSuccessHandler(closeDialog)
        .withFailureHandler(function (err) {
          alert('Error: ' + err);
          btn.disabled = false;
          btn.textContent = 'Generate Receipt';
        })
        .processEOYDocument(fromMonthStr, toMonthStr);
    }

    function closeDialog() {
      google.script.host.close();
    }

    function clearErrors() {
      document.getElementById('errorMessage').style.display = 'none';
      document.getElementById('fromMonth').classList.remove('input-error');
      document.getElementById('fromYear').classList.remove('input-error');
      document.getElementById('toMonth').classList.remove('input-error');
      document.getElementById('toYear').classList.remove('input-error');
    }
  </script>
</body>

</html>
