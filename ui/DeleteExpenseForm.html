<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d93025;
            --primary-dark: #b82a1f;
            --text: #333;
            --text-light: #666;
            --bg: #f8f9fa;
            --card-bg: #fff;
            --warning-bg: #fef7e0;
            --warning-text: #b06000;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text);
            background: var(--bg);
        }

        .form-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            display: block;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
            background-color: white;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(217, 48, 37, 0.1);
        }

        .warning-box {
            background: var(--warning-bg);
            color: var(--warning-text);
            padding: 12px 14px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid rgba(176, 96, 0, 0.1);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            font-family: inherit;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-danger {
            background: linear-gradient(135deg, #d93025 0%, #b82a1f 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(217, 48, 37, 0.2);
        }

        .btn-secondary {
            background: #f1f3f4;
            color: var(--text);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #fce8e6;
            color: #d93025;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            border: 1px solid #f5c2c7;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>🗑️ Delete Expense</h2>

        <div id="errorMessage" class="error-message"></div>

        <form id="deleteForm">
            <div class="form-group">
                <label for="expenseSelect">Select Expense to Delete <span style="color:red">*</span></label>
                <select id="expenseSelect" required>
                    <option value="">-- Choose an expense --</option>
                    <? for (var i = 0; i < expenseItems.length; i++) { ?>
                    <option value="<?= expenseItems[i].name ?>">
                        <?= expenseItems[i].name ?>
                        <?= expenseItems[i].type ? ' (' + expenseItems[i].type + ')' : '' ?>
                    </option>
                    <? } ?>
                </select>
            </div>

            <div class="warning-box">
                <strong>⚠️ Warning:</strong> This will delete the selected expense from
                <? if (mode == 'ry') { ?>
                all months (January - December).
                <? } else { ?>
                the current month through December.
                <? } ?>
            </div>

            <div class="actions">
                <button type="button" class="btn-danger" id="delete-btn" onclick="submitForm()">Delete Expense</button>
                <button type="button" class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
            </div>
        </form>
    </div>

    <script>
        const executionMode = '<?= mode ?>';

        function submitForm() {
            const btn = document.getElementById('delete-btn');
            btn.disabled = true;
            btn.textContent = 'Deleting...';

            var expenseName = document.getElementById('expenseSelect').value;
            var errorDiv = document.getElementById('errorMessage');

            errorDiv.style.display = 'none';

            if (!expenseName) {
                errorDiv.innerHTML = '<strong>Error:</strong> Please select an expense to delete';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Delete Expense';
                return;
            }

            google.script.run
                .withSuccessHandler(closeDialog)
                .withFailureHandler(function (err) {
                    alert('Error: ' + err);
                    btn.disabled = false;
                    btn.textContent = 'Delete Expense';
                })
                .processDeleteForm(expenseName, executionMode);
        }

        function closeDialog() {
            google.script.host.close();
        }
    </script>
</body>

</html>
